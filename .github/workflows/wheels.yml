name: Build Wheels & Publish to PyPI

on:
  pull_request:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

env:
  USE_BAZEL_VERSION: "7.7.0"

jobs:
  build_sdist:
    name: Build sdist
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - name: Check out the repo
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      with:
        persist-credentials: false

    - name: Set up python
      uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
      with:
        python-version: '3.10'

    - name: install python dependencies
      run: pip install build twine tomli

    - name: build sdist
      run: |
        package_build/initialize.sh
        python -m build --sdist package_build/tfx/ -o wheelhouse
        python -m build --sdist package_build/ml-pipelines-sdk/ -o wheelhouse

    - name: List and check sdist
      run: |
        ls -lh wheelhouse/
        twine check wheelhouse/*

    - name: Upload sdist
      uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
      with:
        name: sdist
        path: ./wheelhouse/*.tar.gz

  build_wheels:
    name: >
      build ${{ matrix.python-version }} on ${{ matrix.platform || matrix.os }}
      ${{ (matrix.arch) || '' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu]
        python-version: ['cp310', 'cp311', 'cp312', 'cp313']

    runs-on: ${{ format('{0}-latest', matrix.os) }}
    permissions:
      contents: read
    steps:
    - name: Check out the repo
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      with:
        persist-credentials: false

    - name: Set up python
      uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
      with:
        python-version: '3.10'

    - name: Install python build dependencies
      run: |
          pip install wheel

    - uses: bazel-contrib/setup-bazel@e403ad507104847c3539436f64a9e9eecc73eeec # 0.8.5
      name: Set up Bazel
      with:
        # Avoid downloading Bazel every time.
        bazelisk-cache: true
        # Store build cache per workflow.
        disk-cache: ${{ github.workflow }}-${{ hashFiles('.github/workflows/wheels.yml') }}
        # Share repository cache between workflows.
        repository-cache: true

    - name: Verify bazel installation
      run: |
        which bazel
        bazel info
        bazel version

    - name: Install build
      run: python -m pip install --upgrade pip build

    - name: Build wheels
      run: |
        package_build/initialize.sh
        python -m build --wheel package_build/tfx/
        python -m build --wheel package_build/ml-pipelines-sdk/
        mkdir wheelhouse
        mv dist/*.whl wheelhouse/

    - name: List and check wheels
      run: |
        pip install twine pkginfo>=1.10.0
        ls -lh wheelhouse/
        twine check wheelhouse/*

    - name: Upload wheels
      uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
      with:
        name: wheels-${{ matrix.python-version }}-${{ matrix.os }}
        path: ./wheelhouse/*.whl

  upload_to_pypi:
    name: Upload to PyPI
    runs-on: ubuntu-latest
    if: (github.event_name == 'release' && startsWith(github.ref, 'refs/tags')) || (github.event_name == 'workflow_dispatch')
    needs: [build_wheels, build_sdist]
    environment:
      name: pypi
      url: https://pypi.org/p/tfx
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Retrieve wheels and sdist
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          merge-multiple: true
          path: wheels/

      - name: List the build artifacts
        run: |
          ls -lAs wheels/

      - name: Upload to PyPI
        # zizmor: ignore[use-trusted-publishing]
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          packages-dir: wheels/
          verbose: true
          verify-metadata: true
